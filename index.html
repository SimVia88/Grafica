<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gráfica mensual de seguimiento</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: transparent;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #contenedor {
      width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      max-height: 100%;
      padding: clamp(5px, 1.4vw, 18px);
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>
</head>

<body>

  <div id="contenedor">
    <canvas id="myChart"></canvas>
  </div>

  <script>
    /*
     * ==========================================================
     * CONFIGURACIÓN DE UNIDADES E IDs
     * ==========================================================
     *
     * Añade cada nueva ID dentro de la unidad correspondiente.
     *
     * Las IDs incluidas en "L/km":
     * - Se dividen entre 10.000.
     * - Se muestran con 4 decimales.
     *
     * Las demás IDs:
     * - Se dividen entre 100.
     * - Se muestran con 2 decimales.
     */
    const simbolosConfig = {
      "%": [
        46, 45, 29, 28, 27, 17, 16, 15, 2, 1
      ],

      "kWh": [
        44, 43, 40, 39, 34, 33, 22, 21, 11, 10
      ],

      "m³/persona": [
        9, 41, 42
      ],

      "L/100 Tm": [
        31, 19, 5
      ],

      "kg": [
        8
      ],

      /*
       * AÑADE AQUÍ todas las IDs de los indicadores
       * que deban expresarse en litros por kilómetro.
       */
      "L/km": [
        32, 20, 7
      ]
    };

    function obtenerSimboloDesdeID(id) {
      for (const [simbolo, ids] of Object.entries(simbolosConfig)) {
        if (ids.includes(id)) {
          return simbolo;
        }
      }

      return "";
    }

    function obtenerDivisorDesdeID(id) {
      const simbolo = obtenerSimboloDesdeID(id);

      return simbolo === "L/km"
        ? 10000
        : 100;
    }

    function obtenerDecimalesDesdeID(id) {
      const simbolo = obtenerSimboloDesdeID(id);

      return simbolo === "L/km"
        ? 4
        : 2;
    }

    function obtenerNumero(valor) {
      if (
        valor === null ||
        valor === undefined ||
        valor === ""
      ) {
        return 0;
      }

      let texto = valor
        .toString()
        .trim()
        .replace("%", "")
        .replace(/\s/g, "");

      /*
       * Coma como separador de miles:
       * 1,225 -> 1225
       */
      if (/^-?\d{1,3}(,\d{3})+$/.test(texto)) {
        texto = texto.replace(/,/g, "");
      }

      /*
       * Punto como separador de miles:
       * 1.225 -> 1225
       */
      else if (/^-?\d{1,3}(\.\d{3})+$/.test(texto)) {
        texto = texto.replace(/\./g, "");
      }

      /*
       * Coma decimal:
       * 12,25 -> 12.25
       */
      else {
        texto = texto.replace(",", ".");
      }

      const numero = Number.parseFloat(texto);

      return Number.isFinite(numero)
        ? numero
        : 0;
    }

    function convertir(valor, divisor) {
      return obtenerNumero(valor) / divisor;
    }

    function getQueryParams() {
      const params = new URLSearchParams(
        window.location.search
      );

      const id =
        Number.parseInt(params.get("id"), 10) || null;

      const divisor =
        obtenerDivisorDesdeID(id);

      const decimales =
        obtenerDecimalesDesdeID(id);

      const simbolo =
        obtenerSimboloDesdeID(id);

      return {
        id: id,
        divisor: divisor,
        decimales: decimales,
        simbolo: simbolo,

        referencia: convertir(
          params.get("referencia"),
          divisor
        ),

        datos: [
          convertir(params.get("enero"), divisor),
          convertir(params.get("febrero"), divisor),
          convertir(params.get("marzo"), divisor),
          convertir(params.get("abril"), divisor),
          convertir(params.get("mayo"), divisor),
          convertir(params.get("junio"), divisor),
          convertir(params.get("julio"), divisor),
          convertir(params.get("agosto"), divisor),
          convertir(params.get("septiembre"), divisor),
          convertir(params.get("octubre"), divisor),
          convertir(params.get("noviembre"), divisor),
          convertir(params.get("diciembre"), divisor)
        ]
      };
    }

    const params = getQueryParams();

    // La anchura REAL del WebView determina la tipografía y los márgenes.
    // Mantiene el aspecto original en escritorio.
    const contenedor = document.getElementById("contenedor");
    const ancho = contenedor.clientWidth;
    const movil = ancho < 560;
    const compacto = ancho < 380;
    const ajustar = (desktop, mobile, small) => compacto ? small : (movil ? mobile : desktop);


    const meses = [
      "Enero",
      "Febrero",
      "Marzo",
      "Abril",
      "Mayo",
      "Junio",
      "Julio",
      "Agosto",
      "Septiembre",
      "Octubre",
      "Noviembre",
      "Diciembre"
    ];

    const referenciaArray =
      meses.map(() => params.referencia);

    const ctx =
      document
        .getElementById("myChart")
        .getContext("2d");

    const gradientFill =
      ctx.createLinearGradient(0, 0, 0, 500);

    gradientFill.addColorStop(
      0,
      "rgba(0, 0, 0, 0.15)"
    );

    gradientFill.addColorStop(
      1,
      "rgba(0, 0, 0, 0)"
    );

    const shadowPlugin = {
      id: "lineShadow",

      beforeDatasetDraw(chart, args) {
        if (args.index !== 0) {
          return;
        }

        const contexto = chart.ctx;

        contexto.save();
        contexto.shadowColor =
          "rgba(0, 0, 0, 0.25)";
        contexto.shadowBlur = 8;
        contexto.shadowOffsetY = 4;
      },

      afterDatasetDraw(chart, args) {
        if (args.index !== 0) {
          return;
        }

        chart.ctx.restore();
      }
    };

    const todosLosValores = [
      ...params.datos,
      params.referencia
    ].filter(valor => Number.isFinite(valor));

    const maxValor =
      Math.max(...todosLosValores, 0);

    const minValor =
      Math.min(...todosLosValores, 0);

    const margen =
      maxValor === minValor
        ? Math.max(Math.abs(maxValor) * 0.2, 0.01)
        : (maxValor - minValor) * 0.15;

    const suggestedMin =
      Math.max(0, minValor - margen);

    const suggestedMax =
      maxValor + margen;

    new Chart(ctx, {
      type: "line",

      data: {
        labels: meses,

        datasets: [
          {
            label: "Valores mensuales",
            data: params.datos,

            fill: true,
            backgroundColor: gradientFill,

            borderColor: "#000000",
            borderWidth: ajustar(5, 3, 2.5),

            pointBackgroundColor: "#000000",
            pointBorderColor: "#ffffff",
            pointBorderWidth: ajustar(3, 2, 1.5),

            pointRadius: ajustar(7, 4, 3),
            pointHoverRadius: ajustar(10, 6, 5),

            tension: 0.3,
            spanGaps: false
          },

          {
            label: "Valor de referencia",
            data: referenciaArray,

            fill: false,

            borderColor: "#1e40ff",
            backgroundColor: "#1e40ff",

            borderWidth: ajustar(4, 2.5, 2),
            borderDash: [10, 8],

            pointRadius: 0,
            pointHoverRadius: 0,

            tension: 0
          }
        ]
      },

      options: {
        responsive: true,
        maintainAspectRatio: false,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),

        interaction: {
          mode: "index",
          intersect: false
        },

        layout: {
          padding: {
            top: ajustar(26, 8, 4),
            right: ajustar(34, 8, 2),
            bottom: ajustar(26, 8, 2),
            left: ajustar(34, 8, 2)
          }
        },

        plugins: {
          legend: {
            position: "top",

            labels: {
              color: "#263746",
              usePointStyle: true,
              pointStyle: "circle",
              boxWidth: ajustar(16, 9, 7),
              boxHeight: ajustar(16, 9, 7),
              padding: ajustar(24, 9, 5),

              font: {
                size: ajustar(20, 12, 10),
                weight: "bold"
              }
            }
          },

          tooltip: {
            padding: 16,
            titleColor: "#ffffff",
            bodyColor: "#ffffff",
            backgroundColor: "rgba(38, 55, 70, 0.96)",
            displayColors: true,

            titleFont: {
              size: 18,
              weight: "bold"
            },

            bodyFont: {
              size: 17,
              weight: "bold"
            },

            callbacks: {
              label(context) {
                const valor =
                  Number(context.raw);

                const valorFormateado =
                  valor.toFixed(params.decimales);

                const unidad =
                  params.simbolo
                    ? " " + params.simbolo
                    : "";

                return (
                  context.dataset.label +
                  ": " +
                  valorFormateado +
                  unidad
                );
              }
            }
          }
        },

        scales: {
          x: {
            grid: {
              display: false
            },

            border: {
              color: "rgba(38, 55, 70, 0.45)",
              width: 2
            },

            ticks: {
              color: "#263746",
              padding: ajustar(14, 5, 3),
              maxRotation: 0,
              minRotation: 0,
              autoSkip: true,
              maxTicksLimit: ajustar(12, 7, 6),
              callback(value) {
                const etiqueta = this.getLabelForValue(value);
                return movil ? etiqueta.substring(0, 3) : etiqueta;
              },

              font: {
                size: ajustar(17, 11, 10),
                weight: "bold"
              }
            }
          },

          y: {
            beginAtZero: false,
            suggestedMin: suggestedMin,
            suggestedMax: suggestedMax,

            border: {
              color: "rgba(38, 55, 70, 0.45)",
              width: 2
            },

            grid: {
              color: "rgba(38, 55, 70, 0.14)",
              lineWidth: 1.5
            },

            ticks: {
              color: "#263746",
              padding: ajustar(14, 5, 3),

              font: {
                size: ajustar(17, 11, 10),
                weight: "bold"
              },

              callback(value) {
                return Number(value).toFixed(
                  params.decimales
                );
              }
            },

            title: {
              display: Boolean(params.simbolo),
              text: params.simbolo,
              color: "#263746",
              padding: {
                bottom: 14
              },

              font: {
                size: ajustar(19, 12, 10),
                weight: "bold"
              }
            }
          }
        }
      },

      plugins: [
        shadowPlugin
      ]
    });
  </script>

</body>
</html>
