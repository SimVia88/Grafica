<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gráfica Mensual Neutra</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: transparent;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      width: 100vw !important;
      height: 100vh !important;
      display: block;
    }
  </style>
</head>

<body>
  <canvas id="myChart"></canvas>

  <script>
    function convertir(valor) {
      if (valor === null || valor === undefined || valor === "") return 0;

      let texto = valor.toString().trim().replace("%", "").replace(/\s/g, "");

      // Caso 1,225 = 1225 con separador de miles
      if (/^\d{1,3},\d{3}$/.test(texto)) {
        return parseFloat(texto.replace(",", "")) / 100;
      }

      // Caso 1.225 = 1225 con separador de miles
      if (/^\d{1,3}\.\d{3}$/.test(texto)) {
        return parseFloat(texto.replace(".", "")) / 100;
      }

      // Caso 1225 = 12.25
      if (/^\d+$/.test(texto)) {
        return parseFloat(texto) / 100;
      }

      // Caso 12,25 = 12.25
      texto = texto.replace(",", ".");

      const numero = parseFloat(texto);
      return isNaN(numero) ? 0 : numero;
    }

    function getQueryParams() {
      const params = new URLSearchParams(window.location.search);

      return {
        referencia: convertir(params.get("referencia")),
        datos: [
          convertir(params.get("enero")),
          convertir(params.get("febrero")),
          convertir(params.get("marzo")),
          convertir(params.get("abril")),
          convertir(params.get("mayo")),
          convertir(params.get("junio")),
          convertir(params.get("julio")),
          convertir(params.get("agosto")),
          convertir(params.get("septiembre")),
          convertir(params.get("octubre")),
          convertir(params.get("noviembre")),
          convertir(params.get("diciembre"))
        ]
      };
    }

    const params = getQueryParams();

    const meses = [
      "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
      "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
    ];

    const referenciaArray = meses.map(() => params.referencia);

    const ctx = document.getElementById("myChart").getContext("2d");

    const gradientFill = ctx.createLinearGradient(0, 0, 0, 400);
    gradientFill.addColorStop(0, "rgba(0, 0, 0, 0.15)");
    gradientFill.addColorStop(1, "rgba(0, 0, 0, 0)");

    const shadowPlugin = {
      id: "lineShadow",
      beforeDraw: (chart) => {
        const ctx = chart.ctx;
        ctx.save();
        ctx.shadowColor = "rgba(0, 0, 0, 0.25)";
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 4;
      },
      afterDraw: (chart) => {
        chart.ctx.restore();
      }
    };

    const maxValor = Math.max(...params.datos, params.referencia, 1);
    const minValor = Math.min(...params.datos, params.referencia);

    new Chart(ctx, {
      type: "line",
      data: {
        labels: meses,
        datasets: [
          {
            label: "Valores mensuales",
            data: params.datos,
            fill: true,
            backgroundColor: gradientFill,
            borderColor: "#000000",
            borderWidth: 3,
            pointBackgroundColor: "#000000",
            pointBorderColor: "#ffffff",
            pointRadius: 5,
            pointHoverRadius: 7,
            tension: 0.3
          },
          {
            label: "Valor de referencia",
            data: referenciaArray,
            fill: false,
            borderColor: "#1e40ff",
            borderWidth: 2,
            pointRadius: 0,
            borderDash: [6, 6]
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: {
          padding: 10
        },
        plugins: {
          legend: {
            labels: {
              font: {
                size: 14,
                weight: "bold"
              }
            }
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                return `${context.dataset.label}: ${context.raw.toFixed(2)}`;
              }
            }
          }
        },
        scales: {
          y: {
            beginAtZero: false,
            suggestedMin: minValor * 0.8,
            suggestedMax: maxValor * 1.2,
            ticks: {
              callback: function(value) {
                return Number(value).toFixed(2);
              }
            }
          }
        }
      },
      plugins: [shadowPlugin]
    });
  </script>
</body>
</html>
