<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gráfica de seguimiento</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#E1E8ED;font-family:"Segoe UI",Arial,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
.chart-shell{width:100%;max-height:100%;aspect-ratio:16/9;position:relative;padding:18px;display:flex;flex-direction:column;min-height:0}
.mobile-legend{display:none;align-items:center;justify-content:center;gap:13px;white-space:nowrap;flex-shrink:0;color:#263746;font-size:10px;font-weight:650;padding:0 0 5px}
.legend-item{display:inline-flex;align-items:center;gap:5px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.dot-values{background:#5FD475}.dot-ref{background:#1e40ff}
.chart-area{position:relative;flex:1;min-height:0;min-width:0}.chart-area canvas{display:block;width:100%!important;height:100%!important}
@media(max-width:600px){.chart-shell{padding:5px 6px 5px}.mobile-legend{display:flex}}
@media(max-width:340px){.mobile-legend{font-size:9px;gap:8px}.legend-item{gap:3px}}
</style></head><body><main class="chart-shell"><div class="mobile-legend" aria-label="Leyenda"><span class="legend-item"><span class="dot dot-values"></span>Valores de seguimiento</span><span class="legend-item"><span class="dot dot-ref"></span>Valor de referencia</span></div><div class="chart-area"><canvas id="myChart" role="img" aria-label="Seguimiento semestral y referencia"></canvas></div></main>
<script>
    const simbolosConfig = {
      "%": [
        46, 45, 29, 28, 27, 17, 16, 15, 2, 1
      ],

      "kWh": [
        44, 43, 40, 39, 34, 33, 22, 21, 11, 10
      ],

      "m³/persona": [
        9, 41, 42
      ],

      "L/100 Tm": [
        31, 19, 5
      ],

      "kg": [
        8
      ],

      /*
       * Añade aquí todas las IDs de los indicadores
       * expresados en litros por kilómetro.
       */
      "L/km": [
        32, 20, 7
      ]
    };

    /*
     * Obtiene la unidad asociada a la ID.
     */
    function obtenerSimboloDesdeID(id) {
      for (const [simbolo, ids] of Object.entries(simbolosConfig)) {
        if (ids.includes(id)) {
          return simbolo;
        }
      }

      return "";
    }

    /*
     * Solo L/km constituye una excepción:
     * divide entre 10.000.
     *
     * Todo lo demás divide entre 100.
     */
    function obtenerDivisorDesdeID(id) {
      const simbolo =
        obtenerSimboloDesdeID(id);

      return simbolo === "L/km"
        ? 10000
        : 100;
    }

    /*
     * L/km se muestra con cuatro decimales.
     * El resto, con dos.
     */
    function obtenerDecimalesDesdeID(id) {
      const simbolo =
        obtenerSimboloDesdeID(id);

      return simbolo === "L/km"
        ? 4
        : 2;
    }

    /*
     * Convierte de forma segura el texto recibido desde Adalo.
     *
     * Admite, entre otros:
     * 1225
     * 1,225
     * 1.225
     * 12,25
     * 12.25
     */
    function obtenerNumero(valor) {
      if (
        valor === null ||
        valor === undefined ||
        valor === ""
      ) {
        return 0;
      }

      let texto = valor
        .toString()
        .trim()
        .replace("%", "")
        .replace(/\s/g, "");

      /*
       * Coma como separador de miles:
       * 1,225 -> 1225
       */
      if (/^-?\d{1,3}(,\d{3})+$/.test(texto)) {
        texto = texto.replace(/,/g, "");
      }

      /*
       * Punto como separador de miles:
       * 1.225 -> 1225
       */
      else if (/^-?\d{1,3}(\.\d{3})+$/.test(texto)) {
        texto = texto.replace(/\./g, "");
      }

      /*
       * Coma decimal:
       * 12,25 -> 12.25
       */
      else {
        texto = texto.replace(",", ".");
      }

      const numero =
        Number.parseFloat(texto);

      return Number.isFinite(numero)
        ? numero
        : 0;
    }

    /*
     * Convierte el dato escalado de Adalo
     * al valor real que debe mostrar la gráfica.
     */
    function convertir(valor, divisor) {
      return obtenerNumero(valor) / divisor;
    }

    /*
     * Obtiene todos los parámetros enviados desde Adalo.
     *
     * La URL debe contener:
     * referencia
     * seguimiento1
     * seguimiento2
     * criterio
     * id
     */
    function getQueryParams() {
      const urlParams =
        new URLSearchParams(
          window.location.search
        );

      const id =
        Number.parseInt(
          urlParams.get("id"),
          10
        ) || null;

      const divisor =
        obtenerDivisorDesdeID(id);

      const decimales =
        obtenerDecimalesDesdeID(id);

      const simbolo =
        obtenerSimboloDesdeID(id);

      const criterio =
        (
          urlParams.get("criterio") || "AUM"
        )
          .trim()
          .toUpperCase();

      return {
        id: id,
        divisor: divisor,
        decimales: decimales,
        simbolo: simbolo,
        criterio: criterio,

        referencia: convertir(
          urlParams.get("referencia"),
          divisor
        ),

        seguimiento1: convertir(
          urlParams.get("seguimiento1"),
          divisor
        ),

        seguimiento2: convertir(
          urlParams.get("seguimiento2"),
          divisor
        )
      };
    }


const params=getQueryParams();
const etiquetas=["Seguimiento 1.er semestre","Seguimiento 2.º semestre"];
const datos=[params.seguimiento1,params.seguimiento2];
const colores=datos.map(v=>params.criterio==="AUM"?(v>=params.referencia?"#5FD475":"#F19595"):params.criterio==="DIS"?(v<=params.referencia?"#5FD475":"#F19595"):"#A0A0A0");
const ctx=document.getElementById("myChart").getContext("2d");
const valores=[...datos,params.referencia];
const max=Math.max(0,...valores),min=Math.min(0,...valores);
const margen=max===min?Math.max(Math.abs(max)*.2,params.simbolo==="L/km"?.005:.01):(max-min)*.2;
const suggestedMin=Math.max(0,min-margen),suggestedMax=max+margen;
const referenciaExtendida={id:"referenciaExtendida",afterDatasetsDraw(chart){
  const {ctx,chartArea,scales}=chart;if(!chartArea||!scales.y)return;
  const y=scales.y.getPixelForValue(params.referencia);if(y<chartArea.top||y>chartArea.bottom)return;
  ctx.save();ctx.strokeStyle="#1e40ff";ctx.lineWidth=chart.width<=600?2.5:5;
  ctx.beginPath();ctx.moveTo(chartArea.left,y);ctx.lineTo(chartArea.right,y);ctx.stroke();ctx.restore();
}};
const chart=new Chart(ctx,{
 type:"bar",data:{labels:etiquetas,datasets:[
  {label:"Valores de seguimiento",data:datos,backgroundColor:colores,borderColor:colores,borderWidth:2,borderRadius:14,barPercentage:.7,categoryPercentage:.82,maxBarThickness:140},
  {label:"Valor de referencia",type:"line",data:[params.referencia,params.referencia],borderColor:"#1e40ff",backgroundColor:"#1e40ff",borderWidth:0,pointRadius:0,pointHoverRadius:0,fill:false}
 ]},
 plugins:[referenciaExtendida],
 options:{responsive:true,maintainAspectRatio:false,devicePixelRatio:Math.min(window.devicePixelRatio||1,2),
 interaction:{mode:"index",intersect:false},
 layout:{padding:{top:20,right:24,bottom:20,left:24}},
 plugins:{legend:{position:"top",display:true,labels:{color:"#263746",usePointStyle:true,pointStyle:"circle",boxWidth:18,boxHeight:18,padding:24,font:{size:19,weight:"bold"}}},
 tooltip:{padding:12,backgroundColor:"rgba(38,55,70,.96)",titleColor:"#fff",bodyColor:"#fff",callbacks:{label(c){return c.dataset.label+": "+Number(c.raw).toFixed(params.decimales)+(params.simbolo?" "+params.simbolo:"");}}}},
 scales:{x:{grid:{display:false},border:{color:"rgba(38,55,70,.45)",width:2},ticks:{color:"#263746",padding:14,maxRotation:0,minRotation:0,font:{size:18,weight:"bold"}}},
 y:{beginAtZero:false,suggestedMin,suggestedMax,border:{color:"rgba(38,55,70,.45)",width:2},grid:{color:"rgba(38,55,70,.13)",lineWidth:1.5},ticks:{color:"#263746",padding:12,font:{size:17,weight:"bold"},maxTicksLimit:6,callback(value){const n=Number(value);let d=params.decimales;const ticks=this.getTicks();if(ticks.length>1){const step=Math.abs(ticks[1].value-ticks[0].value);while(d<6&&step>0&&Number(step.toFixed(d))===0)d++;}return n.toFixed(d);}},title:{display:Boolean(params.simbolo),text:params.simbolo,color:"#263746",padding:{bottom:12},font:{size:19,weight:"bold"}}}}
 }});
function ajustar(){
 const ancho=document.querySelector('.chart-shell').getBoundingClientRect().width;
 const movil=ancho<=600;
 const muyEstrecho=ancho<=380;
 chart.options.plugins.legend.display=!movil;
 chart.options.layout.padding=movil?{top:5,right:6,bottom:4,left:3}:{top:20,right:24,bottom:20,left:24};
 chart.options.scales.x.ticks.font.size=movil?(muyEstrecho?10:12):18;
 chart.options.scales.x.ticks.padding=movil?5:14;
 chart.options.scales.x.ticks.callback=function(value){const label=this.getLabelForValue(value);if(!movil)return label;return value===0?["1.er","semestre"]:["2.º","semestre"];};
 chart.options.scales.y.ticks.font.size=movil?10:17;
 chart.options.scales.y.ticks.padding=movil?5:12;
 chart.options.scales.y.ticks.maxTicksLimit=movil?6:7;
 chart.options.scales.y.title.font.size=movil?11:19;
 chart.options.scales.y.title.padding={bottom:movil?4:12};
 chart.options.plugins.tooltip.titleFont={size:movil?12:18,weight:"bold"};
 chart.options.plugins.tooltip.bodyFont={size:movil?12:17,weight:"bold"};
 chart.update('none');
}
let lastWidth=0;
const observer=new ResizeObserver(entries=>{const w=Math.round(entries[0].contentRect.width);if(w!==lastWidth){lastWidth=w;ajustar();}});
observer.observe(document.querySelector('.chart-shell'));
ajustar();
</script></body></html>
