<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gráfica mensual de seguimiento</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: transparent;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #contenedor {
      width: 100%;
      height: 100%;
      padding: 8px;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>
</head>

<body>

  <div id="contenedor">
    <canvas id="myChart"></canvas>
  </div>

  <script>
    /*
     * ==========================================================
     * CONFIGURACIÓN DE UNIDADES E IDs
     * ==========================================================
     *
     * Añade cada nueva ID dentro de la unidad correspondiente.
     *
     * Las IDs incluidas en "L/km":
     * - Se dividen entre 10.000.
     * - Se muestran con 4 decimales.
     *
     * Las demás IDs:
     * - Se dividen entre 100.
     * - Se muestran con 2 decimales.
     */
    const simbolosConfig = {
      "%": [
        46, 45, 29, 28, 27, 17, 16, 15, 2, 1
      ],

      "kWh": [
        44, 43, 40, 39, 34, 33, 22, 21, 11, 10
      ],

      "m³/persona": [
        9, 41, 42
      ],

      "L/100 Tm": [
        31, 19, 5
      ],
	  
	  "kg": [
        8
      ],
	  
      /*
       * AÑADE AQUÍ todas las IDs de los indicadores
       * que deban expresarse en litros por kilómetro.
       */
      "L/km": [
        32, 20, 7
      ]
    };

    /*
     * Devuelve la unidad asociada a una ID.
     */
    function obtenerSimboloDesdeID(id) {
      for (const [simbolo, ids] of Object.entries(simbolosConfig)) {
        if (ids.includes(id)) {
          return simbolo;
        }
      }

      return "";
    }

    /*
     * Determina el divisor según la unidad.
     *
     * Ejemplos:
     *
     * ID de L/km:
     * Adalo envía 338
     * 338 / 10000 = 0.0338 L/km
     *
     * ID normal:
     * Adalo envía 1225
     * 1225 / 100 = 12.25
     */
    function obtenerDivisorDesdeID(id) {
      const simbolo = obtenerSimboloDesdeID(id);

      return simbolo === "L/km"
        ? 10000
        : 100;
    }

    /*
     * Número de decimales que deben mostrarse.
     */
    function obtenerDecimalesDesdeID(id) {
      const simbolo = obtenerSimboloDesdeID(id);

      return simbolo === "L/km"
        ? 4
        : 2;
    }

    /*
     * Convierte en número el valor recibido desde Adalo.
     *
     * Admite:
     * 1225
     * 1,225
     * 1.225
     * 12,25
     * 12.25
     */
    function obtenerNumero(valor) {
      if (
        valor === null ||
        valor === undefined ||
        valor === ""
      ) {
        return 0;
      }

      let texto = valor
        .toString()
        .trim()
        .replace("%", "")
        .replace(/\s/g, "");

      /*
       * Coma como separador de miles:
       * 1,225 -> 1225
       */
      if (/^-?\d{1,3}(,\d{3})+$/.test(texto)) {
        texto = texto.replace(/,/g, "");
      }

      /*
       * Punto como separador de miles:
       * 1.225 -> 1225
       */
      else if (/^-?\d{1,3}(\.\d{3})+$/.test(texto)) {
        texto = texto.replace(/\./g, "");
      }

      /*
       * Coma decimal:
       * 12,25 -> 12.25
       */
      else {
        texto = texto.replace(",", ".");
      }

      const numero = Number.parseFloat(texto);

      return Number.isFinite(numero)
        ? numero
        : 0;
    }

    /*
     * Convierte el dato escalado almacenado en Adalo
     * al valor real que debe mostrar la gráfica.
     */
    function convertir(valor, divisor) {
      return obtenerNumero(valor) / divisor;
    }

    /*
     * Obtiene los parámetros enviados por Adalo.
     *
     * La URL debe incluir también:
     * &id=ID_DEL_INDICADOR
     */
    function getQueryParams() {
      const params = new URLSearchParams(
        window.location.search
      );

      const id =
        Number.parseInt(params.get("id"), 10) || null;

      const divisor =
        obtenerDivisorDesdeID(id);

      const decimales =
        obtenerDecimalesDesdeID(id);

      const simbolo =
        obtenerSimboloDesdeID(id);

      return {
        id: id,
        divisor: divisor,
        decimales: decimales,
        simbolo: simbolo,

        referencia: convertir(
          params.get("referencia"),
          divisor
        ),

        datos: [
          convertir(params.get("enero"), divisor),
          convertir(params.get("febrero"), divisor),
          convertir(params.get("marzo"), divisor),
          convertir(params.get("abril"), divisor),
          convertir(params.get("mayo"), divisor),
          convertir(params.get("junio"), divisor),
          convertir(params.get("julio"), divisor),
          convertir(params.get("agosto"), divisor),
          convertir(params.get("septiembre"), divisor),
          convertir(params.get("octubre"), divisor),
          convertir(params.get("noviembre"), divisor),
          convertir(params.get("diciembre"), divisor)
        ]
      };
    }

    const params = getQueryParams();

    const meses = [
      "Enero",
      "Febrero",
      "Marzo",
      "Abril",
      "Mayo",
      "Junio",
      "Julio",
      "Agosto",
      "Septiembre",
      "Octubre",
      "Noviembre",
      "Diciembre"
    ];

    const referenciaArray =
      meses.map(() => params.referencia);

    const ctx =
      document
        .getElementById("myChart")
        .getContext("2d");

    /*
     * Fondo degradado bajo la línea mensual.
     */
    const gradientFill =
      ctx.createLinearGradient(0, 0, 0, 500);

    gradientFill.addColorStop(
      0,
      "rgba(0, 0, 0, 0.15)"
    );

    gradientFill.addColorStop(
      1,
      "rgba(0, 0, 0, 0)"
    );

    /*
     * Sombra de la línea mensual.
     */
    const shadowPlugin = {
      id: "lineShadow",

      beforeDatasetDraw(chart, args) {
        /*
         * Solo aplicamos sombra al primer dataset:
         * valores mensuales.
         */
        if (args.index !== 0) {
          return;
        }

        const contexto = chart.ctx;

        contexto.save();
        contexto.shadowColor =
          "rgba(0, 0, 0, 0.25)";
        contexto.shadowBlur = 8;
        contexto.shadowOffsetY = 4;
      },

      afterDatasetDraw(chart, args) {
        if (args.index !== 0) {
          return;
        }

        chart.ctx.restore();
      }
    };

    /*
     * Cálculo del rango del eje Y.
     */
    const todosLosValores = [
      ...params.datos,
      params.referencia
    ].filter(valor => Number.isFinite(valor));

    const maxValor =
      Math.max(...todosLosValores, 0);

    const minValor =
      Math.min(...todosLosValores, 0);

    /*
     * Margen visual para evitar que las líneas
     * queden pegadas al límite de la gráfica.
     */
    const margen =
      maxValor === minValor
        ? Math.max(Math.abs(maxValor) * 0.2, 0.01)
        : (maxValor - minValor) * 0.15;

    const suggestedMin =
      Math.max(0, minValor - margen);

    const suggestedMax =
      maxValor + margen;

    new Chart(ctx, {
      type: "line",

      data: {
        labels: meses,

        datasets: [
          {
            label: "Valores mensuales",
            data: params.datos,

            fill: true,
            backgroundColor: gradientFill,

            borderColor: "#000000",
            borderWidth: 3,

            pointBackgroundColor: "#000000",
            pointBorderColor: "#ffffff",
            pointBorderWidth: 2,

            pointRadius: 5,
            pointHoverRadius: 7,

            tension: 0.3,
            spanGaps: false
          },

          {
            label: "Valor de referencia",
            data: referenciaArray,

            fill: false,

            borderColor: "#1e40ff",
            backgroundColor: "#1e40ff",

            borderWidth: 2,
            borderDash: [6, 6],

            pointRadius: 0,
            pointHoverRadius: 0,

            tension: 0
          }
        ]
      },

      options: {
        responsive: true,
        maintainAspectRatio: false,

        interaction: {
          mode: "index",
          intersect: false
        },

        layout: {
          padding: {
            top: 12,
            right: 15,
            bottom: 10,
            left: 10
          }
        },

        plugins: {
          legend: {
            position: "top",

            labels: {
              usePointStyle: true,

              font: {
                size: 14,
                weight: "bold"
              }
            }
          },

          tooltip: {
            callbacks: {
              label(context) {
                const valor =
                  Number(context.raw);

                const valorFormateado =
                  valor.toFixed(params.decimales);

                const unidad =
                  params.simbolo
                    ? " " + params.simbolo
                    : "";

                return (
                  context.dataset.label +
                  ": " +
                  valorFormateado +
                  unidad
                );
              }
            }
          }
        },

        scales: {
          x: {
            grid: {
              display: false
            },

            ticks: {
              font: {
                size: 12
              }
            }
          },

          y: {
            beginAtZero: false,
            suggestedMin: suggestedMin,
            suggestedMax: suggestedMax,

            grid: {
              color: "rgba(0, 0, 0, 0.08)"
            },

            ticks: {
              callback(value) {
                return Number(value).toFixed(
                  params.decimales
                );
              }
            },

            title: {
              display: Boolean(params.simbolo),
              text: params.simbolo,

              font: {
                size: 13,
                weight: "bold"
              }
            }
          }
        }
      },

      plugins: [
        shadowPlugin
      ]
    });
  </script>

</body>
</html>
